# Render's free plan puts the router to sleep after 15 idle minutes; waking it takes about a minute.
# This pings /api/health every 10 minutes from 09:30 to 00:30 India time, so visitors in those hours
# find it awake. It stays off overnight to keep within Render's 750 free hours a month, which are
# shared with the other free services on the same account.
name: Keep router awake
on:
  schedule:
    - cron: "*/10 4-18 * * *"   # UTC; India is UTC+5:30
  workflow_dispatch:            # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://model-router-api.onrender.com/api/health
